<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="bootstrap.css" />
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <div class="container main-div">
      <div><img src="images/png-clipart-casio-f-91w-g-shock-watch-pro-trek-watch-electronics-text-removebg-preview.png" alt="" class="img-fluid " id="img"></div>
      <input class="screen" id="data" onclick="getNumber()" />
      <div class="w-50 d-flex justify-content-around" id="div-1">
        <i
          class="fa-solid fa-volume-high"
          id="volume-on"
          o
          style="color: #67656a"
        ></i>
        <i
          class="fa-solid fa-volume-off"
          id="volume-off"
          style="color: #67656a"
        ></i>
      </div>
      <div class="d-flex justify-content-around align-items-center mt-3" id="div-1">
        <div class="text-center btn-1" id="on">on/ac</div>
        <div class="text-center btn-1" id="gt">gt</div>
        <div class="text-center btn-1 pt-1" id="on" onclick="del()">del</div>
        <div class="text-center btn-1 pt-1" id="gt" onclick="clearData()">
          C
        </div>
      </div>
      <div class="d-flex justify-content-around mt-3" id="div-1">
        <div class="text-center btn-1" id="on" onclick="memoryClear()">mrc</div>
        <div class="text-center btn-1" id="gt" onclick=" memoryPlus()">m+</div>
        <div class="text-center btn-1" id="on" onclick="memoryMinus()">m-</div>
        <div class="text-center btn-1" id="gt">x</div>
      </div>
      <div class="d-flex justify-content-around mt-3" id="div-1">
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          7
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          8
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          9
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          -
        </div>
      </div>
      <div class="d-flex justify-content-around mt-3" id="div-1">
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          4
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          5
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          6
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          +
        </div>
      </div>
      <div class="d-flex justify-content-around mt-3" id="div-1">
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          1
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          2
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          3
        </div>
        <div class="text-center btn-1" id="equal-sign" onclick="result()">
          =
        </div>
      </div>
      <div class="d-flex justify-content-around mt-3 pb-3" id="div-1">
        <div
          class="text-center shadow-sm btn-1"
          id="zero"
          onclick="getNumber(this)"
        >
          0
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          .
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          /
        </div>
        <div class="text-center rounded-circle btn-1" onclick="getNumber(this)">
          *
        </div>
      </div>
    </div>

    <script src="app.js"></script>

    
  </body>
</html>
